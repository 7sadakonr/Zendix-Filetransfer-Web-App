      <h1>Fliq — Fast P2P File & Clipboard Transfer</h1>
      <p>Fliq is a free, open-source web app for transferring files and clipboard content directly between devices using peer-to-peer (WebRTC) technology.</p>
      <h2>Key Features</h2>
      <ul>
        <li><strong>End-to-End Encrypted</strong> — Direct P2P connection, no server storage</li>
        <li><strong>Cross-Platform</strong> — Works on Desktop, iOS, Android via any modern browser</li>
        <li><strong>Clipboard Sync</strong> — Share text instantly between devices</li>
        <li><strong>Fast File Transfer</strong> — Send files up to 100MB with real-time progress tracking</li>
        <li><strong>QR Code Pairing</strong> — Easy device connection via QR code scan</li>
      </ul>
      <h2>How It Works</h2>
      <ol>
        <li><strong>Connect</strong> — Scan a QR code or enter a Peer ID to pair devices</li>
        <li><strong>Transfer</strong> — Share clipboard text or send files directly</li>
        <li><strong>Done</strong> — Data is transferred directly between devices, nothing is stored on servers</li>
      </ol>
      <p>Please enable JavaScript to use Fliq.</p>
      <p><a href="https://github.com/7sadakonr/Fliq-Clipboard-and-File-Transfer-Web-App" style="color: #06b6d4;">View on GitHub</a></p>
